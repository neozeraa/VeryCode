<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60">
  <defs>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <g transform="translate(10, 10)">
    <polygon points="20,0 40,10 40,30 20,40 0,30 0,10" fill="url(#neonGrad)" filter="url(#glow)" />
    <polygon points="20,8 32,15 32,25 20,32 8,25 8,15" fill="#0b0f19" />
    <circle cx="20" cy="20" r="5" fill="#10b981" />
  </g>
  <text x="65" y="38" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="24" fill="#ffffff" letter-spacing="1">
    VERY<tspan fill="#10b981">ROBUX</tspan>
  </text>
</svg>
